[package]
name = "quintal-desktop"
version = "0.0.1"
description = "The Quintal desktop host"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-only"

[lib]
# Tauri 2 builds the app as a library so the same code can back a mobile target
# later; `main.rs` is a thin shim over it.
name = "quintal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
