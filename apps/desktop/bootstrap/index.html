<!doctype html>
<meta charset="utf-8" />
<title>Quintal</title>
<!--
  The bootstrap page, and the only markup this app owns.

  `apps/web` is the UI, and this does not compete with it. It is the one screen
  that *cannot* live in the office: choosing which office to join, at a moment
  when there may be no office to load a page from. Everything else belongs in
  the web app, where a browser can see it too.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 14px/1.55 system-ui, sans-serif; background: #0b0b0c; color: #e4e4e7;
  }
  main { width: min(30rem, 90vw); }
  h1 { font-size: 15px; margin: 0 0 .25rem; }
  p.lede { margin: 0 0 1.25rem; color: #a1a1aa; font-size: 13px; }
  ul { list-style: none; margin: 0 0 1rem; padding: 0; }
  li {
    display: flex; align-items: center; gap: .75rem;
    padding: .6rem .75rem; border: 1px solid #27272a; border-radius: .5rem;
    margin-bottom: .4rem;
  }
  li.active { border-color: #3f6212; background: #1a2e05; }
  .name { font-weight: 500; }
  .url { color: #71717a; font-size: 12px; font-family: ui-monospace, monospace; }
  .grow { flex: 1; min-width: 0; }
  .grow > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    font: inherit; padding: .35rem .7rem; border-radius: .4rem;
    border: 1px solid #3f3f46; background: #18181b; color: #e4e4e7; cursor: pointer;
  }
  button:hover { background: #27272a; }
  button.link { border: 0; background: 0; color: #a1a1aa; padding: .35rem .2rem; }
  form { display: flex; gap: .5rem; }
  input {
    flex: 1; font: inherit; padding: .45rem .6rem; border-radius: .4rem;
    border: 1px solid #3f3f46; background: #09090b; color: #e4e4e7;
  }
  .problem { color: #fca5a5; font-size: 12px; margin: .6rem 0 0; }
  #status { color: #a1a1aa; text-align: center; }
</style>

<main>
  <p id="status">Connecting to your office…</p>
  <p id="escape" hidden style="text-align: center">
    <button class="link" id="elsewhere">Choose a different office</button>
  </p>

  <section id="picker" hidden>
    <h1>Which office?</h1>
    <p class="lede">
      An office is its own place — its own people, its own agents. They do not
      talk to each other, and you can have as many as you like.
    </p>

    <ul id="list"></ul>

    <form id="add">
      <input id="url" value="http://localhost:3000" spellcheck="false" />
      <button type="submit">Add</button>
    </form>
    <p class="problem" id="problem" hidden></p>
  </section>
</main>

<script type="module">
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args ?? {});
  const el = (id) => document.getElementById(id);

  // Only ever shown inside the app; in a browser there is no bridge and nothing
  // here would work, which is why the office picker is an app surface.
  if (!window.__TAURI_INTERNALS__) {
    el('status').textContent = 'Open this in the Quintal app.';
  } else {
    void render();
  }

  function fail(message) {
    const problem = el('problem');
    problem.textContent = message;
    problem.hidden = false;
  }

  async function render() {
    let listed;
    try {
      listed = await invoke('list_offices');
    } catch (error) {
      fail(String(error));
      return;
    }

    // With an office chosen the app is already on its way there; leave the
    // connecting line alone rather than flashing a picker nobody asked for.
    // Once the picker is up it stays up — cancelling a switch should return you
    // to the list, not to a page that will never navigate.
    //
    // An office that never answers would otherwise strand somebody here with
    // nothing to press, so the way out is offered alongside the waiting.
    if (listed.active && el('picker').hidden) {
      el('escape').hidden = false;
      return;
    }

    el('status').hidden = true;
    el('picker').hidden = false;
    // Pre-filled and selected: localhost is the development default, and
    // somebody arriving here from a working app should not have to retype the
    // office they were already using.
    const input = el('url');
    input.focus();
    input.select();

    const list = el('list');
    list.replaceChildren(
      ...listed.offices.map((office) => {
        const row = document.createElement('li');
        if (office.url === listed.active) row.className = 'active';

        const text = document.createElement('div');
        text.className = 'grow';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = office.label;
        const url = document.createElement('div');
        url.className = 'url';
        url.textContent = office.url;
        text.append(name, url);

        const open = document.createElement('button');
        open.textContent = 'Open';
        open.onclick = () => switchTo(office.url);

        const forget = document.createElement('button');
        forget.className = 'link';
        forget.textContent = 'Forget';
        forget.onclick = () => remove(office.url);

        row.append(text, open, forget);
        return row;
      }),
    );
  }

  async function switchTo(url, { leaving = true } = {}) {
    // Switching restarts, so the app comes up granting IPC to exactly one
    // origin. Said out loud rather than done quietly — the window vanishing is
    // alarming if nobody warned you.
    //
    // Except when there is nothing to leave: warning somebody that their first
    // office will restart an app they have not started using is a dialog that
    // only ever gets clicked through.
    if (leaving && !confirm(`Open ${url}?\n\nQuintal will restart.`)) return;
    try {
      await invoke('switch_office', { url });
    } catch (error) {
      fail(error?.message ?? String(error));
    }
  }

  async function remove(url) {
    if (!confirm(`Forget ${url}?\n\nThis machine's registration with it goes too.`)) return;
    try {
      await invoke('remove_office', { url });
      await render();
    } catch (error) {
      fail(error?.message ?? String(error));
    }
  }

  // `open_office_picker` clears the active office and restarts, which lands
  // here with the picker showing — the same place a first run lands.
  el('elsewhere').onclick = () => {
    void invoke('open_office_picker').catch((error) => fail(String(error)));
  };

  el('add').onsubmit = async (event) => {
    event.preventDefault();
    el('problem').hidden = true;
    const hadOffice = (await invoke('list_offices')).offices.length > 0;
    const url = el('url').value.trim();
    if (!url) return;
    try {
      await invoke('add_office', { url, label: null });
      el('url').value = '';
      // The first office added becomes the active one, so go straight in.
      const added = url.replace(/\/+$/, '');
      // Adding does not choose. On a first office there is nothing to stay for,
      // so go straight in; otherwise show the list and let somebody pick.
      if (!hadOffice) await switchTo(added, { leaving: false });
      else await render();
    } catch (error) {
      fail(error?.message ?? String(error));
    }
  };
</script>
