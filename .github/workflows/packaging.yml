name: Packaging

# Installers are built in exactly one place — the release workflow — so its
# packaging steps first run when a tag is already pushed. v0.1.0 failed on two
# paths that had never executed anywhere: the Windows sidecar compile and the
# Linux AppImage bundle. Neither is reachable from a pull request, so neither
# could be proven before it was tagged.
#
# This runs those same scripts from a branch. It is deliberately narrow: only
# changes that can break packaging trigger it, so ordinary desktop work keeps
# the shorter Desktop workflow on its critical path.
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/acp-harness/**'
      - 'scripts/build-harness-sidecar.mjs'
      - 'scripts/build-desktop-release.mjs'
      - 'scripts/release-assets.mjs'
      - 'scripts/release-assets.json'
      - 'scripts/fix-appimage.sh'
      - 'scripts/smoke-appimage.sh'
      - '.github/workflows/release.yml'
      - '.github/workflows/packaging.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/acp-harness/**'
      - 'scripts/build-harness-sidecar.mjs'
      - 'scripts/build-desktop-release.mjs'
      - 'scripts/release-assets.mjs'
      - 'scripts/release-assets.json'
      - 'scripts/fix-appimage.sh'
      - 'scripts/smoke-appimage.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The whole Linux installer path: bundle, repack without libdbus, stage
  # against the shared asset contract, then launch the result. Everything here
  # calls the same scripts the release job calls, so the logic cannot drift;
  # only the runner setup around them is restated.
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          # Must match the release pin, or this proves a different compiler.
          bun-version: '1.3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: packaging-x86_64-unknown-linux-gnu

      - name: System dependencies and smoke tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb at-spi2-core libdbus-1-dev libfuse2 imagemagick tesseract-ocr

      - run: pnpm install --frozen-lockfile

      - name: Build the standalone harness
        run: |
          pnpm --filter @quintal/shared build
          pnpm --filter quintal-acp build
          node scripts/build-harness-sidecar.mjs x86_64-unknown-linux-gnu

      - name: Build installers
        # Tauri reports only `failed to run linuxdeploy` and drops the tool's own
        # stderr, which is the half that says what went wrong. Verbose here, not
        # in release.yml, keeps release logs readable while a branch run stays
        # diagnosable.
        env:
          QUINTAL_TAURI_VERBOSE: '1'
        run: node scripts/build-desktop-release.mjs x86_64-unknown-linux-gnu appimage,deb linux-x64

      - name: Keep AppImage libdbus on the host
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c
          chmod +x "$RUNNER_TEMP/appimagetool"
          bash scripts/fix-appimage.sh apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage "$RUNNER_TEMP/appimagetool"

      - name: Stage installers from the shared asset contract
        run: node scripts/release-assets.mjs stage linux-x64 apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle stage

      - name: AppImage first-launch smoke
        run: |
          mkdir -p smoke-evidence
          xvfb-run -a --server-args="-screen 0 1280x800x24" bash scripts/smoke-appimage.sh stage/*.AppImage smoke-evidence
        timeout-minutes: 5

      - name: Preserve smoke evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-appimage-smoke
          overwrite: true
          path: smoke-evidence/

  # Windows never gets this far in release.yml: the sidecar compile is the step
  # before the regression test, so a failure there leaves both unproven.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: packaging-x86_64-pc-windows-msvc

      - run: pnpm install --frozen-lockfile

      - name: Build the standalone harness
        run: |
          pnpm --filter @quintal/shared build
          pnpm --filter quintal-acp build
          node scripts/build-harness-sidecar.mjs x86_64-pc-windows-msvc

      - name: Packaged harness lookup regression
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml windows_tests::the_windows_harness_beside_the_executable_wins
