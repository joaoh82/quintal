name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started by hand from the Actions tab, so a green build is
  # never blocked on waiting for the right event to come along.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Email was removed wholesale when identity became a keypair. There is no
      # flag and no fallback path, so any reappearance is a regression rather
      # than a feature — and the cheapest place to catch one is before it has
      # a chance to grow a dependency.
      - name: Check no email machinery has come back
        run: |
          set -euo pipefail

          fail=0

          # Mailer transports and the deleted module, in code we own.
          if git grep -nEI 'from .(resend|nodemailer)|require\(.(resend|nodemailer)|lib/mailer|sendMagicLinkEmail|magicLink\(|magicLinkClient|displayNameFromEmail|findUserByEmail' \
               -- ':!*.lock' ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo "::error::Email machinery is back. Identity is a keypair; there is no mailer."
            fail=1
          fi

          # The user table must not regrow an address column. Scoped to source:
          # the drizzle history legitimately still mentions the column it drops.
          if git grep -nEI 'users\.(email|emailVerified)|email_verified' \
               -- 'packages/shared/src' 'apps' ; then
            echo "::error::users.email is gone. Identity is users.pubkey."
            fail=1
          fi

          # Email delivery configuration must not return to the environment.
          if git grep -nEI '(RESEND_API_KEY|SMTP_HOST|SMTP_PORT|SMTP_USER|SMTP_PASSWORD|SMTP_SECURE|EMAIL_FROM)' \
               -- ':!.github/workflows/ci.yml'; then
            echo "::error::Email delivery env vars are back."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "No mailer, no email column, no email env. Good."

      # A `'use server'` file may only export async functions. Exporting a
      # constant from one throws at the moment a form action is submitted —
      # not at build time, and not in any test: `next build` tree-shakes an
      # unused export away entirely, so it can pass while dev is broken. That
      # combination shipped once; this is the cheapest thing that catches it.
      - name: Check "use server" files only export async functions
        run: |
          set -euo pipefail
          fail=0
          for file in $(git grep -l "^'use server'" -- '*.ts' '*.tsx'); do
            if git grep -nE "^export (const|let|var|class|default|function )" -- "$file"; then
              echo "::error file=$file::a 'use server' file may only export async functions"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Every 'use server' file exports only async functions."

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # The Rust host reads the runtime catalogue as generated data, so a
      # change to the TypeScript that is not regenerated means the office and
      # the host disagree about what a runtime id means — and the host is what
      # turns an id into a command to spawn.
      - name: Check the runtime catalogue is up to date
        run: |
          node scripts/emit-runtimes.mjs
          if ! git diff --quiet -- packages/shared/runtimes.generated.json; then
            echo "::error::runtimes.generated.json is stale. Run 'node scripts/emit-runtimes.mjs' and commit it."
            git diff -- packages/shared/runtimes.generated.json
            exit 1
          fi

      # The migration in the repo must match the schema it was generated from.
      - name: Check migrations are up to date
        run: |
          pnpm db:generate
          if ! git diff --quiet -- packages/shared/drizzle; then
            echo "::error::Drizzle schema changed without a committed migration. Run 'pnpm db:generate' and commit the result."
            git diff --stat -- packages/shared/drizzle
            exit 1
          fi

      - name: Smoke test the unified production server
        run: |
          set -euo pipefail
          BETTER_AUTH_SECRET=ci-secret-not-used-anywhere pnpm start &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "health: $(curl -fsS http://127.0.0.1:3000/health)"
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          echo "landing page served from the same port"

          # Sign in with a keypair and fetch every page. Catches a route that
          # throws while rendering, which no unit test sees — these pages are
          # all `force-dynamic`, so `next build` never renders them.
          node scripts/smoke.mjs http://127.0.0.1:3000
