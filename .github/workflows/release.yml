name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (never a branch)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Resolve and check the immutable tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import { validateVersion } from "./scripts/set-version.mjs"; const tag = process.env.RELEASE_TAG; if (!tag.startsWith("v")) throw new Error("Expected v tag"); validateVersion(tag.slice(1));'
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git checkout --detach "$sha"
          node scripts/check-release-version.mjs "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
          key: release-${{ matrix.target }}
      - name: Linux system dependencies and smoke tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb at-spi2-core libdbus-1-dev libfuse2 imagemagick tesseract-ocr
      - name: Rosetta for the Intel sidecar proof
        if: matrix.platform == 'macos-x64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - run: pnpm install --frozen-lockfile
      - name: Build this target's standalone harness
        run: |
          pnpm --filter @quintal/shared build
          pnpm --filter quintal-acp build
          node scripts/build-harness-sidecar.mjs '${{ matrix.target }}'
      - name: Windows packaged harness lookup regression
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml windows_tests::the_windows_harness_beside_the_executable_wins
      - name: Build installers (native Tauri signing and notarization on macOS)
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: node scripts/build-desktop-release.mjs '${{ matrix.target }}' '${{ matrix.bundles }}' '${{ matrix.platform }}'
      - name: Keep AppImage libdbus on the host
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c
          chmod +x "$RUNNER_TEMP/appimagetool"
          bash scripts/fix-appimage.sh apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage "$RUNNER_TEMP/appimagetool"
      - name: Stage installers from the shared asset contract
        run: node scripts/release-assets.mjs stage '${{ matrix.platform }}' 'apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle' stage
      - name: AppImage first-launch smoke
        if: runner.os == 'Linux'
        run: |
          mkdir -p smoke-evidence
          xvfb-run -a --server-args="-screen 0 1280x800x24" bash scripts/smoke-appimage.sh stage/*.AppImage smoke-evidence
        timeout-minutes: 5
      - name: Preserve Linux smoke evidence even on failure
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage-smoke
          overwrite: true
          path: smoke-evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.platform }}
          overwrite: true
          path: stage/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          path: downloaded
      - name: Arrange staged platforms
        run: |
          mkdir staged
          for dir in downloaded/installers-*; do
            mv "$dir" "staged/${dir##*/installers-}"
          done
      - name: Create draft, upload complete assets and checksums, publish last
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.tag }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG"
