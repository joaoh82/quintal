name: Docker image

# Builds and publishes the public office image as ghcr.io/joaoh82/quintal.
#
# Strategy: each architecture builds on its native runner (ubuntu-24.04 for
# amd64, ubuntu-24.04-arm for arm64), pushes to GHCR by digest, then a final
# job stitches the per-arch digests into a single multi-arch manifest. No QEMU.
#
# Versioning: the same `v*` tag `.github/workflows/release.yml` uses to build
# desktop installers, so the image and the app agree.
#
# Triggers:
#   - pull_request (path-filtered) → build only, plus a compose smoke
#   - push to main                 → :main + :sha-<7>
#   - push tags v*.*.*             → :{version} + :{major}.{minor} + :latest
#                                    (:latest only for stable semver)

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/smoke.mjs'

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.event_name == 'pull_request' }}

permissions: {}

env:
  IMAGE_NAME: ${{ vars.GHCR_IMAGE != '' && vars.GHCR_IMAGE || format('ghcr.io/{0}', github.repository) }}

jobs:
  smoke:
    name: Compose smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: quintal-ci-${{ github.run_id }}
      QUINTAL_VOLUME: quintal-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # smoke.mjs imports @quintal/shared; the package export points at dist/.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @quintal/shared build

      - name: Compose up, smoke, restart, session still valid
        run: |
          set -euo pipefail
          trap 'docker compose down -v --remove-orphans || true' EXIT

          docker compose up -d --build --wait --wait-timeout 180 --pull never

          echo "health: $(curl -fsS http://localhost:3000/health)"
          node scripts/smoke.mjs http://localhost:3000 --save-identity /tmp/quintal-smoke-identity.json

          docker compose restart
          docker compose up -d --wait --wait-timeout 180 --pull never

          echo "health after restart: $(curl -fsS http://localhost:3000/health)"
          node scripts/smoke.mjs http://localhost:3000 --identity /tmp/quintal-smoke-identity.json

          docker run --rm --entrypoint node -w /app/packages/shared \
            "ghcr.io/joaoh82/quintal:${QUINTAL_VERSION:-latest}" \
            --input-type=module -e 'import("@libsql/client").then(() => console.log("libsql ok"))'

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # :latest is left to flavor.latest=auto — stable semver tags only,
          # never prereleases, never main.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (PR, load locally)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: quintal:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('type=gha,scope=docker-{0},mode=max', matrix.arch) || '' }}

      - name: Native binding check (PR)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --entrypoint node -w /app/packages/shared \
            quintal:ci-${{ matrix.arch }} \
            --input-type=module -e 'import("@libsql/client").then(() => console.log("libsql ok"))'

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}-buildcache:${{ matrix.arch }}
          cache-to: |
            type=registry,ref=${{ env.IMAGE_NAME }}-buildcache:${{ matrix.arch }},mode=max,compression=zstd

      - name: Native binding check
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}@${DIGEST}"
          docker pull "$image"
          docker run --rm --entrypoint node -w /app/packages/shared \
            "$image" \
            --input-type=module -e 'import("@libsql/client").then(() => console.log("libsql ok"))'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download all per-arch digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create and push manifest list
        id: manifest
        working-directory: /tmp/digests
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tags+=("-t" "$tag")
          done <<< "$META_TAGS"

          digests=()
          for digest in *; do
            digests+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${tags[@]}" "${digests[@]}"

          first_tag=$(echo "$META_TAGS" | head -n1)
          merged_digest=$(docker buildx imagetools inspect "$first_tag" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${merged_digest}" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          MERGED_DIGEST: ${{ steps.manifest.outputs.digest }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published \`${IMAGE_NAME}\`"
            echo
            echo "**Digest:** \`${MERGED_DIGEST}\`"
            echo
            echo "**Tags:**"
            echo '```'
            echo "${META_TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
